# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = backend/storage/migrations

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path
prepend_sys_path = .

# Version path separator; use os.pathsep for Windows/Unix compat.
version_path_separator = os

# Database URL is read from the environment via env.py (not set here)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
