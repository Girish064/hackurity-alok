version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: agentshield_postgres
    environment:
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: agentshield
      POSTGRES_DB: agentshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentshield_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentshield_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentshield:agentshield@postgres:5432/agentshield
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── OPA (Open Policy Agent) ────────────────────────────────────────────────
  # Optional — set OPA_URL=http://opa:8181 in the backend service to enable.
  # Run independently: docker compose up opa
  opa:
    image: openpolicyagent/opa:latest
    container_name: agentshield_opa
    ports:
      - "8181:8181"
    command:
      - run
      - --server
      - --log-level=info
      - --addr=0.0.0.0:8181
      - /policies/agentshield.rego
    volumes:
      - ./policy:/policies:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
